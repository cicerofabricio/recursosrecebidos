name: Atualizar dados públicos
on:
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publicacao-recursosrecebidos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Baixar e cruzar fontes oficiais
        run: python3 scripts/atualizar.py --output "${RUNNER_TEMP}/recursos.json"
      - name: Publicar carga validada
        shell: bash
        run: |
          set -euo pipefail
          aud='https://recursosrecebidos.sigpc.com.br/api/atualizacao'
          encoded="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1],safe=""))' "$aud")"
          token="$(curl -fsS --max-time 15 -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded}" | jq -er '.value')"
          echo "::add-mask::$token"
          printf '%s' "$token" | python3 -c 'import base64,json,sys; h,c,_=sys.stdin.read().split("."); a=json.loads(base64.urlsafe_b64decode(h+"===")); b=json.loads(base64.urlsafe_b64decode(c+"===")); print(json.dumps({"alg":a.get("alg"),"kid":a.get("kid"),**{k:b.get(k) for k in ("iss","aud","repository","repository_id","repository_owner_id","workflow_ref","ref","event_name","runner_environment","nbf","iat","exp")}}))'
          curl --fail-with-body --silent --show-error --max-time 45 -H "Authorization: Bearer $token" -H 'Content-Type: application/json' --data-binary "@${RUNNER_TEMP}/recursos.json" "$aud"
